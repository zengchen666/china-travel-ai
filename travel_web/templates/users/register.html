{% extends 'base.html' %}
{% block title %}注册 - 旅游景点推荐系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow mt-5">
            <div class="card-header bg-success text-white text-center py-4">
                <i class="fas fa-user-plus fa-3x mb-2"></i>
                <h4 class="mb-0">用户注册</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">邮箱（选填）</label>
                        <input type="email" name="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">确认密码</label>
                        <input type="password" name="password2" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2">注册</button>
                </form>
                <p class="text-center mt-3 mb-0">已有账号？<a href="{% url 'users:login' %}">立即登录</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
